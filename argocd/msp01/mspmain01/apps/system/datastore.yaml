apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datastore-mspmain01
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Deploys first
spec:
  project: msp
  source:
    repoURL: https://github.com/NOAA-PMEL/msp-gitops.git
    targetRevision: HEAD
    path: kustomize/apps/datastore/overlays/mspmain01
    # kustomize:
    #   patches:
    #     - patch: |-
    #         - op: replace
    #           path: /spec/subscriber/ref/namespace
    #           value: mspmain01
    #       target:
    #         kind: Trigger
  destination:
    server: https://kubernetes.default.svc
    # namespace: payload01
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
  ignoreDifferences:
    - group: serving.knative.dev
      kind: Service
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
        - /spec/template/metadata/annotations
        - /spec/template/metadata/labels
        - /spec/traffic