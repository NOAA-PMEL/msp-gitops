apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mspmain01-system

resources:
  - ../../base

configMapGenerator:
  - name: sampling-states
    envs:
      - sampling-states.env
  - name: sampling-states-states
    files:
      - ../../shared_configs/templates/states/in_sector_state.json
      - ../../shared_configs/templates/states/nominal_concentrations_state.json
      - ../../shared_configs/templates/states/nominal_location_state.json
      - ../../shared_configs/templates/states/marjorie_c_nominal_location_state.json
      - ../../shared_configs/templates/states/telemetry_verified_state.json
      - ../../shared_configs/templates/states/cascade_ready_state.json
      - ../../shared_configs/templates/states/maintenance_active_state.json

