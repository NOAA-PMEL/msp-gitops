apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmt-ccn200
  labels:
    app: dmt-ccn200
spec:
  selector:
    matchLabels:
      app: dmt-ccn200
  template:
    metadata:
      labels:
        app: dmt-ccn200
    spec:
      imagePullSecrets:
        - name: ghcr-ro-secret
      containers:
      - name: dmt-ccn200
        image: ghcr.io/noaa-pmel/msp/dmt-ccn200:latest
        imagePullPolicy: "IfNotPresent"
        env:
          - name: ENVDS_CORE_NAMESPACE_PREFIX
            valueFrom:
              configMapKeyRef:
                  name: dmt-ccn200-config
                  key: namespace_prefix
          - name: ENVDS_ENV_ID
            valueFrom:
              configMapKeyRef:
                name: dmt-ccn200-config
                key: envds_env_id
          - name: REDIS_OM_URL
            value: redis://redis.default
          - name: LOG_LEVEL
            value: DEBUG
        resources:
          requests:
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - name: http
          containerPort: 9080
          protocol: TCP
        volumeMounts:
            - name: dmt-ccn200-config
              mountPath: /app/config/sensor.conf
              subPath: sensor.conf
            - name: sensor-definition
              mountPath: /app/DMT_CCN-200_sensor_definition.json
              subPath: DMT_CCN-200_sensor_definition.json
      volumes:
        - name: dmt-ccn200-config
          configMap:
            name: dmt-ccn200-config
        - name: sensor-definition
          configMap:
            name: sensor-definition