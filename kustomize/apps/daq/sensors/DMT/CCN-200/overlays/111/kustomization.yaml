apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: dmt-ccn200
namespace: payload02-hardware

resources:
- ../../base
- ccn200-configmap.yaml

nameSuffix: "-111"

patches:
  - target:
      kind: Deployment
      name: dmt-ccn200
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/configMap/name
        value: dmt-ccn200-config-111
      - op: replace
        path: /spec/template/spec/volumes/1/configMap/name
        value: sensor-definition-111