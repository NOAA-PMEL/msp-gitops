apiVersion: v1
kind: ConfigMap
metadata:
  name: sensirion-sdp810-config
  # namespace: msp
  labels:
    app: sensirion-sdp810
    # app-group: envds-sensor-payload03
    app-group: envds-sensor-mspmain01
data:
  namespace_prefix: mspmain01 
  envds_env_id: mspmain01
  # namespace_prefix: mspbase01 
  # envds_env_id: mspbase01
  sensor.conf: |
    serial_number: "inletflow"
    daq_id: mspmain01
    interfaces:
      # default: serial
      default:
        interface_env_id: mspmain01 # if omitted, defaults to envds_id of sensor
        interface_id: LabJack::Tx::ljtx226
        path: i2c
    i2c_address: "25"

    
    