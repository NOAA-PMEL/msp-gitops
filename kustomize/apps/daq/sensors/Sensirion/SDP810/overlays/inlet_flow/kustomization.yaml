apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: sensirion-sdp810

namespace: revpi2-hardware
# namespace: mspbase01-hardware

# Example configuration for the webserver
# at https://github.com/monopole/hello
# commonLabels:
#   app: nginx

# resources:
# # Example configuration for the webserver
# # at https://github.com/monopole/hello
#   nameSuffix: -usc206
#   commonLabels:
#     app: usconverters-uscdr301
#     variant: test

resources:
- ../../base
- sdp810-configmap.yaml

nameSuffix: "-inlet_flow"
# patchesStrategicMerge:
#   - deployment.yaml

patches:
#   # change configmap names to account for s/n suffix
  - target:
      kind: Deployment
      name: sensirion-sdp810
    patch: |-
      - op: replace 
        path: /spec/template/spec/volumes/0/configMap/name
        value: sensirion-sdp810-config-inlet_flow
      - op: replace 
        path: /spec/template/spec/volumes/1/configMap/name
        value: sensor-definition-inlet_flow

