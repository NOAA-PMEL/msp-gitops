apiVersion: v1
kind: ConfigMap
metadata:
  name: brechtel-td3105-config
  labels:
    app: brechtel-td3105
    app-group: envds-sensor-payload02
data:
  namespace_prefix: payload02
  envds_env_id: payload02
  sensor.conf: |
    serial_number: "001"
    daq_id: payload02
    interfaces:
      default:
        interface_env_id: payload02-hardware
        interface_id: USconverters::USCDR301::usc16
        path: port-1
    settings:
      sampling_state: sampling