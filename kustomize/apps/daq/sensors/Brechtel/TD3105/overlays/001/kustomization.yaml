apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: brechtel-td3105
namespace: payload02-hardware

resources:
- ../../base
- td3105-configmap.yaml

nameSuffix: "-001"

patches:
  - target:
      kind: Deployment
      name: brechtel-td3105
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/configMap/name
        value: brechtel-td3105-config-001
      - op: replace
        path: /spec/template/spec/volumes/1/configMap/name
        value: sensor-definition-001