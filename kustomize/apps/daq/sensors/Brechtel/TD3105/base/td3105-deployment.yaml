apiVersion: apps/v1
kind: Deployment
metadata:
  name: brechtel-td3105
  labels:
    app: brechtel-td3105
spec:
  selector:
    matchLabels:
      app: brechtel-td3105
  template:
    metadata:
      labels:
        app: brechtel-td3105
    spec:
      imagePullSecrets:
        - name: ghcr-ro-secret
      containers:
      - name: brechtel-td3105
        image: ghcr.io/noaa-pmel/msp/brechtel-td3105:latest
        imagePullPolicy: "IfNotPresent"
        env:
          - name: ENVDS_CORE_NAMESPACE_PREFIX
            valueFrom:
              configMapKeyRef:
                  name: brechtel-td3105-config
                  key: namespace_prefix
          - name: ENVDS_ENV_ID
            valueFrom:
              configMapKeyRef:
                name: brechtel-td3105-config
                key: envds_env_id
          - name: REDIS_OM_URL
            value: redis://redis.default
          - name: LOG_LEVEL
            value: DEBUG
        resources:
          requests:
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - name: http
          containerPort: 9080
          protocol: TCP
        volumeMounts:
            - name: brechtel-td3105-config
              mountPath: /app/config/sensor.conf
              subPath: sensor.conf
            - name: sensor-definition
              mountPath: /app/Brechtel_TD3105_sensor_definition.json
              subPath: Brechtel_TD3105_sensor_definition.json
      volumes:
        - name: brechtel-td3105-config
          configMap:
            name: brechtel-td3105-config
        - name: sensor-definition
          configMap:
            name: sensor-definition