apiVersion: v1
kind: ConfigMap
metadata:
  name: kippzonen-splite2-config
  # namespace: msp
  labels:
    app: kippzonen-splite2
    app-group: envds-sensor-mspmain01
data:
  namespace_prefix: mspmain01
  envds_env_id: mspmain01
  sensor.conf: |
    serial_number: "742"
    daq_id: mspmain01
    interfaces:
      default:
        interface_env_id: mspmain01
        interface_id: LabJack::Tx::ljtx226
        path: voltage_in-0
