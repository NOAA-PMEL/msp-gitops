apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: dwyer-scd1000

namespace: mspmain01-hardware

resources:
- ../../base

nameSuffix: "-mspmain01"

# Generate the ConfigMap dynamically so it gets a hash suffix
configMapGenerator:
  - name: dwyer-scd1000-config
    literals:
      - namespace_prefix=mspmain01
      - envds_env_id=mspmain01
    files:
      - operational.conf
