apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: usconverters-uscdr301
namespace: payload01-hardware

resources:
- ../../base
- USCDR301-configmap.yaml

nameSuffix: -usc14

commonLabels:
  instance: usc14

patches:
  - target:
      kind: Deployment
      name: usconverters-uscdr301
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/configMap/name
        value: usconverters-uscdr301-config-usc14